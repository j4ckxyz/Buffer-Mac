name: Compile and Release Universal DMG

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

jobs:
  release:
    name: Build & Release DMG
    runs-on: macos-14
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest-stable'

      - name: Compile and Package Universal DMG
        run: |
          chmod +x ./build_dmg.sh
          chmod +x ./build_app.sh
          ./build_dmg.sh

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Buffer-Mac-DMG
          path: Buffer-Mac.dmg

      - name: Create GitHub Release (Push tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Buffer-Mac.dmg
          draft: false
          prerelease: false
          name: Release ${{ github.ref_name }}
          body: |
            This is a official release download for Buffer-Mac compiled natively for both Apple Silicon (arm64) and Intel (x86_64) Apple Macs.
            
            ## Installation
            
            1. Download the `Buffer-Mac.dmg` asset below.
            2. Double-click to mount the DMG, then drag the **BufferMenubar** app icon into your **Applications** folder.
            3. Right-click the app in `/Applications` and select **Open** to authorise Gatekeeper, or go to **System Settings > Privacy & Security** and select **Open Anyway**.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Rolling Release (Push main)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          files: Buffer-Mac.dmg
          tag_name: latest
          make_latest: true
          name: Latest Rolling Build
          body: |
            This is a rolling build generated automatically after the latest push to the main branch, compiled natively for both Apple Silicon (arm64) and Intel (x86_64) Apple Macs.
            
            ## Installation
            
            1. Download the `Buffer-Mac.dmg` asset below.
            2. Double-click to mount the DMG, then drag the **BufferMenubar** app icon into your **Applications** folder.
            3. Right-click the app in `/Applications` and select **Open** to authorise Gatekeeper, or go to **System Settings > Privacy & Security** and select **Open Anyway**.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
